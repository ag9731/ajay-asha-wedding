  </head>
  <body class="bg-burgundy-950 text-ivory-100 antialiased selection:bg-gold selection:text-burgundy-950 overflow-x-hidden">
    <div id="root"></div>

    <!-- Background Music Audio Element for immediate autoplay on link open -->
    <audio id="wedding-bgm" src="/audio/bgm.mp3" autoplay loop preload="auto" playsinline></audio>
    <script>
      (function() {
        const bgm = document.getElementById('wedding-bgm');
        if (!bgm) return;
        bgm.volume = 0.65;

        function attemptPlay() {
          if (!bgm.paused) return;
          const promise = bgm.play();
          if (promise !== undefined) {
            promise.then(function() {
              window.dispatchEvent(new CustomEvent('wedding-bgm-play'));
              cleanup();
            }).catch(function() {
              // Waiting for interaction if blocked by browser policy
            });
          }
        }

        const events = ['click', 'touchstart', 'touchend', 'touchmove', 'pointerdown', 'pointerup', 'mousedown', 'mousemove', 'pointermove', 'scroll', 'wheel', 'keydown', 'focus'];

        function cleanup() {
          events.forEach(function(evt) {
            window.removeEventListener(evt, attemptPlay, { capture: true });
            document.removeEventListener(evt, attemptPlay, { capture: true });
          });
        }

        // Try playing immediately
        attemptPlay();
        document.addEventListener('DOMContentLoaded', attemptPlay);
        window.addEventListener('load', attemptPlay);
        window.addEventListener('focus', attemptPlay);

        events.forEach(function(evt) {
          window.addEventListener(evt, attemptPlay, { passive: true, capture: true });
          document.addEventListener(evt, attemptPlay, { passive: true, capture: true });
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
